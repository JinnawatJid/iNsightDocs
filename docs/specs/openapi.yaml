openapi: 3.0.0
info:
  title: Customer Credit Data API
  version: 1.0.0
  description: API for external systems (Sales Department) to read active customer credit limits.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  schemas:
    CreditData:
      type: object
      properties:
        customer_id:
          type: string
          example: "01016AY"
        status:
          type: string
          example: "Approved"
        credit_limit:
          type: number
          description: Approved credit limit amount.
          example: 500000.00
        credit_terms:
          type: object
          properties:
            gs: { type: integer, example: 30 }
            ae: { type: integer, example: 60 }
            yc: { type: integer, example: 45 }
        updated_at:
          type: string
          format: date-time
          example: "2023-10-25T14:30:00Z"

security:
  - ApiKeyAuth: []

paths:
  /api/external/credit-status/{customerId}:
    get:
      summary: Get active credit data
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditData'
        '404':
          description: Customer or credit record not found
