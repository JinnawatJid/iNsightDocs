version: '3.8'

services:
  frontend:
    image: credit-request-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  backend:
    image: credit-request-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Exposed for debugging, or if you want to hit API directly
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_TYPE=${DB_TYPE:-mssql}
      - DB_SERVER=${DB_SERVER}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
